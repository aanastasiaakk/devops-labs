              valueFrom:
                secretKeyRef:
                  name: task-manager-secret
                  key: DATABASE_URL
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
