# Source: task-manager/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-config
  namespace: lab4
  labels:
    helm.sh/chart: task-manager-0.1.0
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/instance: task-manager
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: task-manager
