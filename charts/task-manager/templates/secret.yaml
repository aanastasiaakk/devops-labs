{{- /* ЛР-5: якщо задано existingSecret, Secret не рендериться (його створюють вручну, не з Git) */}}
{{- if not .Values.existingSecret }}
{{- $secretName := include "task-manager.secretName" . }}
{{- $password := .Values.postgresql.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "POSTGRES_PASSWORD") }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- $pgHost := include "task-manager.componentName" (dict "ctx" $ "component" "postgres") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgresql.username $password $pgHost .Values.postgresql.service.port .Values.postgresql.database | quote }}
{{- end }}
