# Source: task-manager/templates/hooks/pre-upgrade-db-check.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: task-manager-pre-upgrade-check
  namespace: lab4
  labels:
    helm.sh/chart: task-manager-0.1.0
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/instance: task-manager
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: task-manager
    app.kubernetes.io/component: pre-upgrade-check
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-manager
        app.kubernetes.io/instance: task-manager
        app.kubernetes.io/component: pre-upgrade-check
    spec:
      restartPolicy: Never
      containers:
        - name: db-check
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: "task-manager-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: task-manager-config
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: task-manager-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-manager-secret
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e
              echo "[pre-upgrade] реліз task-manager: перевірка перед оновленням до ревізії 1"
              pg_isready -t 30
              COUNT=$(psql -tAc 'SELECT count(*) FROM tasks')
              echo "[pre-upgrade] задач у базі перед оновленням: $COUNT"
              echo "[pre-upgrade] база доступна, оновлення можна продовжувати"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
