nameOverride: ""
fullnameOverride: ""

# Ім'я Secret, створеного вручну (kubectl create secret). Якщо задано, чарт не створює власний Secret.
# Ключі: POSTGRES_PASSWORD, DATABASE_URL. Використовується в GitOps (ЛР-5), щоб не тримати пароль у Git.
existingSecret: ""

# Через скільки секунд без прогресу Deployment вважається невдалим (стандарт Kubernetes: 600)
progressDeadlineSeconds: 600

# ЛР-6: progressive delivery з Argo Rollouts для tasks-service.
# enabled: false -> звичайний Deployment (як у ЛР-3..5); true -> Rollout зі стратегією нижче.
# Потрібен контролер Argo Rollouts у кластері (argocd-apps/argo-rollouts.yaml).
rollout:
  enabled: false
  # canary:    {canary: {steps: [{setWeight: 20}, {pause: {}}, ...]}}
  # blueGreen: {blueGreen: {autoPromotionEnabled: false, scaleDownDelaySeconds: 30}}
  #            activeService/previewService чарт підставить сам (tasks-service і tasks-service-preview)
  strategy: {}

image:
  tag: "1.1.0"
  pullPolicy: IfNotPresent

tasksService:
  replicaCount: 1
  image:
    repository: ghcr.io/aanastasiaakk/devops-labs/tasks-service
    tag: ""
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 192Mi

statsService:
  replicaCount: 1
  image:
    repository: ghcr.io/aanastasiaakk/devops-labs/stats-service
    tag: ""
  containerPort: 8001
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/aanastasiaakk/devops-labs/frontend
    tag: ""
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

postgresql:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
  database: tasks
  username: app
  password: ""
  service:
    port: 5432
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
  service:
    port: 6379
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

config:
  cacheTTL: 5

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  annotations: {}

hooks:
  preUpgradeCheck:
    enabled: true

tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.11.1"
