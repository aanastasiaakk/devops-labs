# Source: task-manager/templates/tasks-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-tasks-service
  namespace: task-manager
  labels:
    helm.sh/chart: task-manager-0.2.0
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/instance: task-manager
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: task-manager
    app.kubernetes.io/component: tasks-service
spec:
  replicas: 2
  # Скільки чекати на успішне розгортання, перш ніж позначити Deployment як невдалий (Argo CD: Degraded)
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: task-manager
      app.kubernetes.io/instance: task-manager
      app.kubernetes.io/component: tasks-service
  template:
    metadata:
      labels:
        helm.sh/chart: task-manager-0.2.0
        app.kubernetes.io/name: task-manager
        app.kubernetes.io/instance: task-manager
        app.kubernetes.io/version: "1.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: task-manager
        app.kubernetes.io/component: tasks-service
      annotations:
        checksum/config: 9eccde950d601668fd05e8e24313be53e2d5c69f17d27392f65df7c7a96c3515
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h task-manager-postgres -p 5432; do echo 'waiting for postgres'; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: tasks-service
          image: ghcr.io/aanastasiaakk/devops-labs/tasks-service:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: task-manager-db
                  key: DATABASE_URL
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            limits:
              cpu: 250m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
