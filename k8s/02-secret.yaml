# Чутливі параметри. Значення навчальні, не від реальних систем.
# stringData дозволяє писати значення як звичайний текст - Kubernetes сам закодує їх у base64.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: task-manager
  labels:
    app.kubernetes.io/part-of: task-manager
type: Opaque
stringData:
  POSTGRES_PASSWORD: "lab3-demo-password"
  DATABASE_URL: "postgresql://app:lab3-demo-password@postgres:5432/tasks"
