{{- $c := dict "ctx" $ "component" "frontend" }}
{{- $v := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-manager.componentName" $c }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-manager.componentLabels" $c | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "task-manager.componentSelectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-manager.componentLabels" $c | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: {{ include "task-manager.image" (dict "ctx" $ "image" $v.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $v.containerPort }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ $v.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ $v.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "task-manager.configName" . }}
            items:
              - key: default.conf
                path: default.conf
