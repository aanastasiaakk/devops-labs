{{- /* ЛР-6: коли rollout.enabled, tasks-service розгортає Rollout (tasks-rollout.yaml), а не Deployment.
     Обидва одночасно не можна: два контролери керували б тими самими подами. */}}
{{- if not .Values.rollout.enabled }}
{{- $c := dict "ctx" $ "component" "tasks-service" }}
{{- $v := .Values.tasksService }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-manager.componentName" $c }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-manager.componentLabels" $c | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  # Скільки чекати на успішне розгортання, перш ніж позначити Deployment як невдалий (Argo CD: Degraded)
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "task-manager.componentSelectorLabels" $c | nindent 6 }}
  template:
    {{- include "task-manager.tasksPodTemplate" . | nindent 4 }}
{{- end }}
