{{- if .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "task-manager.componentName" (dict "ctx" $ "component" "postgres-data") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-manager.componentLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.postgresql.persistence.accessMode }}
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
