{{- $c := dict "ctx" $ "component" "stats-service" }}
{{- $v := .Values.statsService }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-manager.componentName" $c }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-manager.componentLabels" $c | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  # Скільки чекати на успішне розгортання, перш ніж позначити Deployment як невдалий (Argo CD: Degraded)
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "task-manager.componentSelectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-manager.componentLabels" $c | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stats-service
          image: {{ include "task-manager.image" (dict "ctx" $ "image" $v.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $v.containerPort }}
          env:
            - name: TASKS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-manager.configName" . }}
                  key: TASKS_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-manager.configName" . }}
                  key: REDIS_URL
            - name: CACHE_TTL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-manager.configName" . }}
                  key: CACHE_TTL
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $v.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $v.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
