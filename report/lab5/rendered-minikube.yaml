# Source: task-manager/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-config
  namespace: task-manager
  labels:
    helm.sh/chart: task-manager-0.2.0
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/instance: task-manager
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: task-manager
data:
  POSTGRES_DB: "tasks"
  POSTGRES_USER: "app"
  TASKS_URL: "http://task-manager-tasks-service:8000"
  REDIS_URL: "redis://task-manager-redis:6379/0"
  CACHE_TTL: "5"
  default.conf: |
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/tasks {
            proxy_pass http://task-manager-tasks-service:8000/tasks;
        }

        location /api/version {
            proxy_pass http://task-manager-tasks-service:8000/health;
        }

        location /api/stats {
            proxy_pass http://task-manager-stats-service:8001/stats;
        }
    }
